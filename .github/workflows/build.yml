name: docker image build and pusha
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      # 添加这个步骤：创建 SSH 密钥文件
      -
        name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa.nuc
          chmod 600 ~/.ssh/id_rsa.nuc
          # 添加主机到 known_hosts（可选，但推荐）
          ssh-keyscan -p 11003 swimminghao.asuscomm.com >> ~/.ssh/known_hosts
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: swimminghao/dockertips:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: deploy to aws
        run: |
          cd ansible/
          pip install ansible
          echo ${{ secrets.ANSIBLE_VAULT }} > vault_pass.txt
          export ANSIBLE_VAULT_PASSWORD_FILE=vault_pass.txt
          ansible-vault decrypt aws.pem
          ansible-playbook -i hosts deploy.yml